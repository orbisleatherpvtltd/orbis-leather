services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obris
      POSTGRES_USER: obris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - obris_postgres_data:/var/lib/postgresql/data

volumes:
  obris_postgres_data:
